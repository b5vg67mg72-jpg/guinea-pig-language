<text x="48" y="142" font-size="12" font-weight="850" letter-spacing="1.8" fill="#A94F38">START HERE</text><text x="48" y="190" font-size="39" font-weight="850" letter-spacing="-1.6" fill="#242A27">The five vowel sounds</text><text x="48" y="220" font-size="15" fill="#626862">Master these five characters first—they appear in every hiragana row.</text>
<g transform="translate(48 249)"><rect width="597" height="76" rx="12" fill="#E9EEE7"/><text x="20" y="27" font-size="11" font-weight="850" letter-spacing="1.4" fill="#526258">YOUR GOAL</text><text x="20" y="53" font-size="14" font-weight="700" fill="#242A27">Recognize, say, and write あ · い · う · え · お without looking.</text><rect x="502" y="20" width="75" height="36" rx="18" fill="#fff"/><text x="539" y="43" text-anchor="middle" font-size="12" font-weight="800" fill="#526258">10 MIN</text></g>
<text x="48" y="367" font-size="11" font-weight="850" letter-spacing="1.4" fill="#34443B">1 · SAY AND TRACE</text><text x="645" y="367" text-anchor="end" font-size="11" fill="#777C77">Trace left to right</text>
